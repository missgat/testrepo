<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Health Articles</title>
</head>
<body>
  <h1>Health Articles</h1>
  <div id="articles"></div>
<script src="./health_article.js">
    [
    {
      "title": "Healthy Sleep Architecture",
      "description": "Optimizing stages of deep and REM sleep for recovery.",
      "ways_to_achieve": [
        "Maintain a strict sleep-wake schedule",
        "Keep bedroom temperature near 65°F (18°C)",
        "Eliminate screens 60 minutes before bed"
      ],
      "benefits": [
        "Enhanced memory consolidation",
        "Optimized hormone regulation",
        "Stronger immune function"
      ]
    }
  ]
</script>
<script>
    var jsonText = document.getElementById('articles-json').textContent;
    var articles = JSON.parse(jsonText);
    var articlesDiv = document.getElementById('articles');

    articles.forEach(function(article) {
      var articleDiv = document.createElement('div');
      articleDiv.classList.add('article');

      var title = document.createElement('h2');
      title.textContent = article.title;

      var description = document.createElement('p');
      description.textContent = article.description;

      var waysHeader = document.createElement('h3');
      waysHeader.textContent = 'Ways to Achieve:';

      var waysList = document.createElement('ul');
      article.ways_to_achieve.forEach(function(way) {
        var listItem = document.createElement('li');
        listItem.textContent = way;
        waysList.appendChild(listItem);
      });

      var benefitsHeader = document.createElement('h3');
      benefitsHeader.textContent = 'Benefits:';

      var benefitsList = document.createElement('ul');
      article.benefits.forEach(function(benefit) {
        var listItem = document.createElement('li');
        listItem.textContent = benefit;
        benefitsList.appendChild(listItem);
      });

      articleDiv.appendChild(title);
      articleDiv.appendChild(description);
      articleDiv.appendChild(waysHeader);
      articleDiv.appendChild(waysList);
      articleDiv.appendChild(benefitsHeader);
      articleDiv.appendChild(benefitsList);

      articlesDiv.appendChild(articleDiv);
    });
  </script>
    
</body>
</html>
